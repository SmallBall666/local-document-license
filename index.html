<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件授權工具</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;color:#172822;background:#f1f5f2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1060px;margin:auto;padding:48px 24px 70px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dbe5dd;padding-bottom:22px}.brand{font-size:19px;font-weight:750;letter-spacing:.08em}.badge{color:#357052;background:#e1eee4;border-radius:30px;padding:7px 13px;font-size:12px;font-weight:700}.intro{padding:49px 0 28px}.eyebrow{color:#47815d;font-weight:700;font-size:12px;letter-spacing:.16em}.intro h1{font-size:38px;letter-spacing:-.03em;margin:12px 0}.intro p{color:#6b7e72;line-height:1.8;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #dfe9e0;border-radius:18px;padding:27px;box-shadow:0 8px 28px #214c2e08}.cardtop{display:flex;gap:14px;align-items:center;margin-bottom:21px}.icon{width:43px;height:43px;border-radius:13px;background:#e7f2e9;display:grid;place-items:center;color:#3c7854;font-size:21px}.card h2{font-size:20px;margin:0 0 4px}.sub{font-size:13px;color:#829187}.step{font-size:12px;color:#64816e;font-weight:700;margin:22px 0 9px;display:block}.drop{border:1.5px dashed #bbd2c0;border-radius:12px;background:#f8fbf8;padding:23px 14px;text-align:center;color:#587563;cursor:pointer;display:block}.drop strong{display:block;color:#315f42;font-size:14px;margin-bottom:7px}.drop span{font-size:12px;overflow-wrap:anywhere}.drop input{max-width:100%;margin-top:12px;font-size:12px}button{width:100%;border:0;background:#326d4a;color:white;border-radius:10px;padding:14px;font-weight:700;font-size:14px;cursor:pointer;margin-top:20px}button:hover{background:#26573a}button:disabled{opacity:.5;cursor:wait}input[type=text]{width:100%;padding:13px;border:1px solid #cfddd1;border-radius:9px;font:inherit;font-size:14px;outline-color:#57966c} .result{display:none;margin-top:18px;background:#eef7ee;border:1px solid #d0e8d1;padding:16px;border-radius:10px;overflow-wrap:anywhere}.result.show{display:block}.result small{color:#62836b}.code{font-family:monospace;font-weight:700;letter-spacing:.03em;font-size:16px;margin:9px 0}.copy{margin:0;background:#e0eee2;color:#315f42;padding:9px}.status{font-size:13px;line-height:1.6;margin-top:13px;color:#a13f35;min-height:20px}.info{margin-top:24px;color:#64796b;font-size:13px;line-height:1.9}.info b{color:#3b5d47}.foot{margin-top:34px;color:#a0afa3;font-size:12px;text-align:center}@media(max-width:700px){.wrap{padding:28px 18px}.grid{grid-template-columns:1fr}.intro h1{font-size:30px}.intro{padding-top:35px}}
</style></head><body><main class="wrap"><header><div class="brand">◈ 文件授權工具</div><div class="badge">● 本機處理</div></header><section class="intro"><div class="eyebrow">LOCAL DOCUMENT SECURITY</div><h1>讓文件，只在授權時開啟。</h1><p>選擇文件產生加密檔與當日授權碼，使用授權碼即可解鎖下載原始文件。</p></section><div class="grid"><section class="card"><div class="cardtop"><div class="icon">＋</div><div><h2>加密文件</h2><div class="sub">建立可開啟的加密文件與今日授權碼</div></div></div><label class="step">01　選擇原始文件</label><label class="drop"><strong>選擇要加密的文件</strong><span>支援各種檔案格式</span><br><input id="source" type="file"></label><button id="encrypt">加密並下載文件　→</button><div class="status" id="encStatus" role="status"></div><div class="result" id="result"><small>今日授權碼 · 請妥善保存</small><div class="code" id="code"></div><button class="copy" id="copy">複製授權碼</button><small>授權碼僅在本機日期為產生當日可用。</small></div></section><section class="card"><div class="cardtop"><div class="icon">↗</div><div><h2>解鎖文件</h2><div class="sub">輸入授權碼還原原始文件</div></div></div><label class="step">01　選擇加密文件</label><label class="drop"><strong>選擇加密文件</strong><span>選擇 .licensed 或授權文件 .html</span><br><input id="locked" type="file" accept=".licensed,.html"></label><label class="step" for="license">02　輸入授權碼</label><input id="license" type="text" placeholder="例如：20261030-..." autocomplete="off" spellcheck="false"><button id="decrypt">解鎖並下載文件　→</button><div class="status" id="decStatus" role="status"></div></section></div><div class="info"><b>使用前請留意</b><br>文件在瀏覽器內處理，不會上傳。請同時保存加密檔與授權碼；遺失授權碼將無法還原。授權期限依電腦本機日期判斷，調整系統時間可能繞過期限，請勿將此工具視為防止蓄意繞過的授權系統。下載後的原始檔不再受到保護。</div><div class="foot">本機使用 · 無需註冊或部署</div></main><script>
const $=id=>document.getElementById(id);const enc=new TextEncoder(),dec=new TextDecoder();
const b64=b=>{let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(s)};const un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const today=()=>{let d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`};
async function key(code,salt){let material=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function standalone(pack){
const encoded=b64(enc.encode(JSON.stringify(pack)));
return `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>受保護的文件</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif;background:#f1f5f2;color:#172822;margin:0;display:grid;min-height:100vh;place-items:center}.card{box-sizing:border-box;width:min(440px,calc(100% - 36px));background:white;padding:36px;border:1px solid #dfe9e0;border-radius:18px;box-shadow:0 12px 40px #214c2e10}.icon{font-size:27px;color:#3c7854}h1{font-size:24px;margin:20px 0 8px}p{color:#708277;line-height:1.7;font-size:14px}label{display:block;margin:24px 0 8px;font-size:13px;font-weight:700}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #cfddd1;border-radius:9px;font-size:15px}button{width:100%;border:0;background:#326d4a;color:#fff;border-radius:10px;padding:14px;font-size:15px;font-weight:700;margin-top:16px;cursor:pointer}button:disabled{opacity:.5}.status{color:#a13f35;font-size:13px;min-height:20px}.note{font-size:12px;color:#87968b;margin-top:26px}</style></head><body><main class="card"><div class="icon">◈</div><h1>這份文件受到保護</h1><p>請輸入文件產生時的當日授權碼，解鎖後即可下載原始文件。</p><label for="license">文件授權碼</label><input id="license" type="text" placeholder="輸入完整授權碼" autocomplete="off" spellcheck="false"><button id="unlock">解鎖文件 →</button><p class="status" id="status" role="status"></p><p class="note">文件在本機解鎖，不會上傳。授權日期以本機日期為準。</p></main><script>
const packageData='${encoded}';
const un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const utf=new TextEncoder(),decoder=new TextDecoder();
const today=()=>{let d=new Date();return String(d.getFullYear())+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
document.getElementById('unlock').onclick=async()=>{let button=document.getElementById('unlock'),status=document.getElementById('status');status.textContent='';try{if(!globalThis.crypto?.subtle)throw Error('瀏覽器不支援本機加密功能，請使用新版 Chrome、Edge 或 Safari。');let code=document.getElementById('license').value.trim().toUpperCase();if(!/^[0-9]{8}(?:-[0-9A-F]{8}){4}$/.test(code))throw Error('請輸入完整且正確格式的授權碼。');if(code.slice(0,8)!==today())throw Error('授權碼不是今天的日期，無法解鎖。');button.disabled=true;status.textContent='解鎖中，請稍候…';let p=JSON.parse(decoder.decode(un64(packageData)));let material=await crypto.subtle.importKey('raw',utf.encode(code),'PBKDF2',false,['deriveKey']);let key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:un64(p.salt),iterations:210000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);let plain;try{plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(p.iv)},key,un64(p.data)))}catch{throw Error('授權碼不正確，或加密文件已損毀。')}let n=new DataView(plain.buffer,plain.byteOffset,plain.byteLength).getUint32(0);if(n>plain.length-4)throw Error('加密文件格式錯誤。');let meta=JSON.parse(decoder.decode(plain.subarray(4,4+n)));if(meta.date!==today())throw Error('這份文件的授權日期不是今天，無法解鎖。');let url=URL.createObjectURL(new Blob([plain.subarray(4+n)],{type:meta.type||'application/octet-stream'}));let a=document.createElement('a');a.href=url;a.download=meta.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status.style.color='#326d4a';status.textContent='解鎖成功，原始文件已開始下載。';}catch(e){status.style.color='#a13f35';status.textContent=e.message||'解鎖失敗。'}finally{button.disabled=false}};
<\/script></body></html>`;
}
function err(id,msg){$(id).textContent=msg}function supported(){if(!globalThis.crypto?.subtle)throw Error('瀏覽器無法使用加密功能，請使用新版 Chrome、Edge 或 Safari 開啟。')}
$('encrypt').onclick=async()=>{let btn=$('encrypt');err('encStatus','');$('result').classList.remove('show');try{supported();let f=$('source').files[0];if(!f)throw Error('請先選擇要加密的文件。');btn.disabled=true;err('encStatus','加密中，請稍候…');let date=today(),random=crypto.getRandomValues(new Uint8Array(16)),code=date+'-'+Array.from(random,x=>x.toString(16).padStart(2,'0')).join('').match(/.{1,8}/g).join('-').toUpperCase(),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));let k=await key(code,salt);let metadata=enc.encode(JSON.stringify({name:f.name,type:f.type,date}));let head=new Uint8Array(4);new DataView(head.buffer).setUint32(0,metadata.length);let content=new Uint8Array(await f.arrayBuffer()),payload=new Uint8Array(4+metadata.length+content.length);payload.set(head);payload.set(metadata,4);payload.set(content,4+metadata.length);let ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,payload);let pack={format:'local-license-v1',salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(ciphertext))};download(new Blob([standalone(pack)],{type:'text/html;charset=utf-8'}),f.name+'.授權文件.html');$('code').textContent=code;$('result').classList.add('show');err('encStatus','加密完成，已開始下載。');}catch(e){err('encStatus',e.message||'加密失敗。')}finally{btn.disabled=false}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('code').textContent);$('copy').textContent='已複製';setTimeout(()=>$('copy').textContent='複製授權碼',2000)}catch{err('encStatus','無法自動複製，請手動選取授權碼複製。')}};
$('decrypt').onclick=async()=>{let btn=$('decrypt');err('decStatus','');try{supported();let f=$('locked').files[0],code=$('license').value.trim().toUpperCase();if(!f)throw Error('請先選擇加密文件。');if(!/^[0-9]{8}(?:-[0-9A-F]{8}){4}$/.test(code))throw Error('授權碼格式不正確，請確認後重試。');if(code.slice(0,8)!==today())throw Error('授權碼不是今天的日期，無法解鎖。');btn.disabled=true;err('decStatus','解鎖中，請稍候…');let raw=await f.text(),p;if(f.name.toLowerCase().endsWith('.html')){let match=raw.match(/const packageData='([A-Za-z0-9+/=]+)'/);if(!match)throw Error('這不是本工具支援的授權文件。');p=JSON.parse(dec.decode(un64(match[1])))}else p=JSON.parse(raw);if(p.format!=='local-license-v1')throw Error('這不是本工具支援的加密檔案。');let salt=un64(p.salt),iv=un64(p.iv),data=un64(p.data);if(salt.length!==16||iv.length!==12)throw Error('加密檔案格式錯誤。');let k=await key(code,salt),plain;try{plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,data))}catch{throw Error('授權碼不正確，或加密檔案已損毀。')}let n=new DataView(plain.buffer,plain.byteOffset,plain.byteLength).getUint32(0);if(n>plain.length-4)throw Error('加密檔案格式錯誤。');let meta=JSON.parse(dec.decode(plain.subarray(4,4+n)));if(meta.date!==today())throw Error('這份文件的授權日期不是今天，無法解鎖。');download(new Blob([plain.subarray(4+n)],{type:meta.type||'application/octet-stream'}),meta.name);err('decStatus','解鎖完成，已開始下載原始文件。')}catch(e){err('decStatus',e.message||'解鎖失敗，請確認檔案。')}finally{btn.disabled=false}};
</script></body></html>
